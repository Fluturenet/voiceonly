<!-- app/templates/admin/logs.html -->
{% extends "base.html" %}

{% block title %}Logs - VoiceOnly{% endblock %}

{% block content %}
<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2>Log di Sistema</h2>
        <a href="/admin/logs?clear=1" class="btn btn-danger" 
           onclick="return confirm('Cancellare tutti i log?')">
            Cancella Log
        </a>
    </div>
    
    {% if logs %}
    <div style="background: #2c3e50; color: #ecf0f1; padding: 1rem; border-radius: 4px; font-family: monospace; max-height: 500px; overflow-y: auto;">
        {% for log in logs %}
        <div style="margin-bottom: 0.5rem; {% if 'ERROR' in log %}color: #e74c3c{% elif 'DOWNLOAD' in log %}color: #27ae60{% endif %}">
            {{ log }}
        </div>
        {% endfor %}
    </div>
    {% else %}
    <p style="text-align: center; color: #7f8c8d; padding: 2rem;">
        Nessun log disponibile.
    </p>
    {% endif %}
</div>
{% endblock %}
